---
# Configure network and DNS settings
- name: Wait for master VMs to get IP addresses
  ansible.builtin.include_tasks: wait_for_vm_ips.yaml

- name: Create cluster network conf on dnsmasq when SNO
  ansible.builtin.template:
    src: "cluster-network.conf-sno.j2"
    dest: "/etc/NetworkManager/dnsmasq.d/{{ clustername }}.conf"
    mode: '0644'
    selevel: s0
    serole: object_r
    setype: dnsmasq_etc_t
    seuser: system_u
  register: dnsmasq
  become: true
  when: sno == "true"

- name: Create cluster network conf on dnsmasq when not SNO
  ansible.builtin.template:
    src: "cluster-network.conf.j2"
    dest: "/etc/NetworkManager/dnsmasq.d/{{ clustername }}.conf"
    mode: '0644'
    selevel: s0
    serole: object_r
    setype: dnsmasq_etc_t
    seuser: system_u
  register: dnsmasqconf
  become: true
  when: sno == "false"

- name: Create addnhosts file when not SNO
  ansible.builtin.template:
    src: "dnsmasq.openshift.addnhosts.j2"
    dest: "/etc/dnsmasq.{{ clustername }}.addnhosts"
    mode: '0644'
  register: addnhosts
  become: true
  when: sno == "false"

- name: Create addnhosts file when SNO
  ansible.builtin.template:
    src: "dnsmasq.openshift.addnhosts-sno.j2"
    dest: "/etc/dnsmasq.{{ clustername }}.addnhosts"
    mode: '0644'
  register: addnhosts
  become: true
  when: sno == "true"

# On Fedora, systemd-resolved owns /etc/resolv.conf (127.0.0.53).
# A drop-in is needed so resolved forwards cluster domain queries
# to NM's dnsmasq (127.0.0.1). This must be (re)created here because
# cleanup.yaml deletes it when destroy_if_exists is true.
# IMPORTANT: This must happen BEFORE restarting NM/libvirtd, otherwise
# libvirt's dnsmasq queries systemd-resolved without the routing rule
# and caches NXDOMAIN for the cluster domain.
- name: Configure systemd-resolved to forward cluster domain to NM dnsmasq
  ansible.builtin.copy:
    dest: "/etc/systemd/resolved.conf.d/{{ clustername }}-dns.conf"
    content: |
      [Resolve]
      DNS=127.0.0.1
      Domains=~{{ clustername }}.{{ basedomain }}
    mode: '0644'
  register: resolved_dropin
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

- name: Restart systemd-resolved to apply cluster DNS forwarding
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
  become: true
  when:
    - ansible_facts['distribution'] == 'Fedora'
    - resolved_dropin.changed

- name: Restart Network Manager when configuring dnsmasq
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  become: true

- name: Restart libvirt when configuring dnsmasq
  ansible.builtin.service:
    name: libvirtd
    state: restarted
  become: true

- name: Configure DHCP reservations
  ansible.builtin.include_tasks: configure_dhcp.yaml
