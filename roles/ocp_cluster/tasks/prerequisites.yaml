---
# =============================================================================
# System prerequisites setup
# =============================================================================

# -----------------------------------------------------------------------------
# Package Installation
# -----------------------------------------------------------------------------
- name: Ensure necessary packages are installed
  ansible.builtin.yum:
    name: "{{ ocp_cluster_required_packages }}"
    state: present
  become: true

# -----------------------------------------------------------------------------
# Libvirt Service
# -----------------------------------------------------------------------------
- name: Ensure libvirtd service is running and enabled
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true
  become: true

# -----------------------------------------------------------------------------
# NetworkManager DNS Configuration
# -----------------------------------------------------------------------------
- name: Check current NetworkManager DNS configuration
  ansible.builtin.stat:
    path: "/etc/NetworkManager/conf.d/nm-dns.conf"
  register: nm_dns_conf

- name: Configure NetworkManager to use dnsmasq
  ansible.builtin.copy:
    dest: "/etc/NetworkManager/conf.d/nm-dns.conf"
    content: |
      [main]
      dns=dnsmasq
    mode: '0644'
  register: nm_dns_configured
  become: true

# -----------------------------------------------------------------------------
# systemd-resolved Handling
# -----------------------------------------------------------------------------
# On Fedora, systemd-resolved may be managed by corporate tooling (e.g. CSB)
# that re-enables it and resets /etc/resolv.conf to the stub resolver
# (127.0.0.53). We only ensure the drop-in directory exists here; the actual
# drop-in file is created in configure_network.yaml (which runs after
# cleanup.yaml, avoiding the file being deleted before it's needed).
- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    mode: '0755'
  become: true
  when: ansible_facts['distribution'] == 'Fedora'

# -----------------------------------------------------------------------------
# Restart Services
# -----------------------------------------------------------------------------
- name: Restart NetworkManager to apply DNS configuration
  ansible.builtin.service:
    name: NetworkManager
    state: restarted
  become: true
  when: nm_dns_configured.changed

- name: Wait for NetworkManager to stabilize
  ansible.builtin.pause:
    seconds: "{{ ocp_cluster_nm_restart_delay }}"
  when: nm_dns_configured.changed

# -----------------------------------------------------------------------------
# Python Dependencies
# -----------------------------------------------------------------------------
- name: Ensure Python packages are installed
  ansible.builtin.pip:
    name: "{{ ocp_cluster_python_packages }}"
    state: present
    executable: pip
